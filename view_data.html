<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated User Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Generated User Data</h1>
    <div id="userData"></div>

    <script>
        fetch('FAKER_ACTIVITY.php')
            .then(response => response.text())
            .then(data => {
                document.getElementById('userData').innerHTML = data;
            })
            .catch(error => console.error('Error fetching data:', error));
    </script>
</body>
</html>
